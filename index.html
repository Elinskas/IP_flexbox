<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая 2</title>
    <style>
        body {
            width: 1000px;
        }

        .container-1 {
            display: flex;
            gap: 10px;
            height: 200px;
            margin-bottom: 50px;
        }

        .col-1 {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .block-1 {
            background-color: #004d4d;
            color: white;
            padding: 10px;
            flex: 1;
        }

        .container-2 {
            display: flex;
            gap: 15px;
            height: 400px;
        }

        .col-2 {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .container-2 .col-2:first-child {
            flex: 0.5;
        }

        .card-2 {
            position: relative;
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .title-2 {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            padding: 8px 12px;
            color: white;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container-1">
        <div class="col-1">
            <div class="block-1">1</div>
            <div class="block-1">2</div>
            <div class="block-1">3</div>
        </div>
        <div class="col-1">
            <div class="block-1">4</div>
        </div>
        <div class="col-1">
            <div class="block-1">5</div>
        </div>
    </div>

    <div class="container-2">
        <div class="col-2">
            <div class="card-2" style="background-image: url('https://images.pexels.com/photos/1001435/pexels-photo-1001435.jpeg?auto=compress&cs=tinysrgb&w=300&h=200&fit=crop');">
                <div class="title-2">Рисунок 1</div>
            </div>
            <div class="card-2" style="background-image: url('https://images.pexels.com/photos/1287145/pexels-photo-1287145.jpeg?auto=compress&cs=tinysrgb&w=300&h=200&fit=crop');">
                <div class="title-2">Рисунок 2</div>
            </div>
            <div class="card-2" style="background-image: url('https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg?auto=compress&cs=tinysrgb&w=300&h=200&fit=crop');">
                <div class="title-2">Рисунок 3</div>
            </div>
        </div>
        
        <div class="col-2">
            <div class="card-2" style="background-image: url('https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=300&h=600&fit=crop');">
                <div class="title-2">Рисунок 4</div>
            </div>
        </div>
        
        <div class="col-2">
            <div class="card-2" style="background-image: url('https://images.pexels.com/photos/1770809/pexels-photo-1770809.jpeg?auto=compress&cs=tinysrgb&w=300&h=600&fit=crop');">
                <div class="title-2">Рисунок 5</div>
            </div>
        </div>
    </div>

</body>
</html>
